<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dev Punjabi — Research Engineer</title>
    <meta name="description" content="Dev Punjabi is a research engineer in Karlsruhe, Germany, working on machine learning and AI systems — alongside sculpture, digital 3D art and Taekwondo." />
    <meta name="author" content="Dev Punjabi" />
    <meta name="theme-color" content="#fafaf9" />
    <link rel="canonical" href="https://devpunjabi.github.io/devpunjabiportfolio/" />

    <!--
      This is a GitHub Pages project site, so the robots.txt crawlers actually
      fetch is https://devpunjabi.github.io/robots.txt — it belongs to the root
      user-pages repo, not this one. public/robots.txt here is only a fallback
      for a future custom domain, which makes this tag the directive that counts.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <link rel="icon" type="image/svg+xml" href="/devpunjabiportfolio/favicon.svg" />

    <!-- Link previews (Slack, LinkedIn, WhatsApp, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dev Punjabi" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:title" content="Dev Punjabi — Research Engineer" />
    <meta property="og:description" content="Machine learning and AI systems research in Karlsruhe, Germany — alongside sculpture, digital 3D art and Taekwondo." />
    <meta property="og:url" content="https://devpunjabi.github.io/devpunjabiportfolio/" />
    <meta property="og:image" content="https://devpunjabi.github.io/devpunjabiportfolio/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dev Punjabi presenting research at KIT" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dev Punjabi — Research Engineer" />
    <meta name="twitter:description" content="Machine learning and AI systems research in Karlsruhe, Germany." />
    <meta name="twitter:image" content="https://devpunjabi.github.io/devpunjabiportfolio/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!--
      Structured data describing the person behind the site. Search engines use
      this to build an entity rather than guessing from prose.

      `sameAs` is what most strongly ties this page to the same person elsewhere,
      so fill in the profile URLs in config/site.ts and mirror them here as you
      publish them.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Dev Punjabi",
        "jobTitle": "Research Engineer",
        "description": "Research engineer working on machine learning for chemistry — reaction prediction, IR spectrum prediction and agentic research-data curation.",
        "url": "https://devpunjabi.github.io/devpunjabiportfolio/",
        "image": "https://devpunjabi.github.io/devpunjabiportfolio/og-image.jpg",
        "worksFor": {
          "@type": "Organization",
          "name": "Karlsruhe Institute of Technology",
          "alternateName": "KIT",
          "url": "https://www.kit.edu/"
        },
        "knowsAbout": [
          "Machine learning",
          "Research data management",
          "Cheminformatics",
          "Reaction prediction",
          "Infrared spectroscopy",
          "Sculpture",
          "Digital 3D modelling",
          "Taekwondo"
        ],
        "knowsLanguage": ["en", "de"],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Karlsruhe",
          "addressCountry": "DE"
        }
      }
    </script>
  </head>
  <body class="bg-[#fafaf9] text-[#1c1917] antialiased">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
